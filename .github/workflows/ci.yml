name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback:
        description: "回滚到上一个 release bundle（不部署新代码）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # 只取消 CI（test/build），不取消部署：SSH 部署中途被打断会停在半部署状态
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test（Testcontainers 自带 MySQL，Docker 内置）
        run: mvn -B -f backend/pom.xml test
      - name: 打印覆盖率汇总（按模块）
        # 不设阈值门禁：覆盖率只作为可见指标，卡构建会在演示/迭代期带来无谓阻塞
        run: |
          printf '%-24s %10s %10s %8s\n' 模块 指令数 未覆盖 覆盖率
          for csv in $(find backend -path '*/target/site/jacoco/jacoco.csv' | sort); do
            module=$(echo "$csv" | cut -d/ -f2)
            awk -F, -v module="$module" '
              NR > 1 { miss += $4 + $6; cov += $5 + $7 }
              END {
                total = miss + cov
                printf "%-24s %10d %10d %7.1f%%\n", module, total, miss, (total ? cov * 100 / total : 0)
              }' "$csv"
          done
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/**/target/site/jacoco/
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      SSH_CMD: ssh -i ~/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 deploy key（服务器网关仅放行 upload/deploy/status/rollback 四动词）
        run: |
          install -m600 /dev/stdin ~/deploy_key <<<"${{ secrets.SMARTORE_DEPLOY_KEY }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: 回滚（inputs.rollback=true 时）
        if: ${{ inputs.rollback }}
        run: $SSH_CMD ${{ secrets.SMARTORE_DEPLOY_HOST }} rollback
      - name: 打 bundle 并上传
        if: ${{ !inputs.rollback }}
        run: |
          git bundle create deploy.bundle HEAD
          $SSH_CMD ${{ secrets.SMARTORE_DEPLOY_HOST }} upload < deploy.bundle
      - name: 部署 + 健康门禁（失败即 exit 1）
        if: ${{ !inputs.rollback }}
        run: $SSH_CMD ${{ secrets.SMARTORE_DEPLOY_HOST }} deploy
      - name: 部署后状态
        if: always()
        run: $SSH_CMD ${{ secrets.SMARTORE_DEPLOY_HOST }} status || true
