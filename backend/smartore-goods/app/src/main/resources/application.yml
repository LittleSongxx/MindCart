server:
  port: ${SMARTORE_GOODS_PORT:9102}
  shutdown: graceful

spring:
  application:
    name: smartore-goods
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # 商品目录读多写少：接 Redis 缓存。装配在 common 的 CacheAutoConfiguration，
  # 需要 smartore.cache.enabled=true 才生效（见文件末尾）
  data:
    redis:
      host: ${SMARTORE_REDIS_HOST:127.0.0.1}
      port: ${SMARTORE_REDIS_PORT:26379}
      password: ${SMARTORE_REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${SMARTORE_NACOS_ADDR:127.0.0.1:28848}
        username: ${SMARTORE_NACOS_USERNAME:nacos}
        password: ${SMARTORE_NACOS_PASSWORD:nacos}
        group: ${SMARTORE_NACOS_GROUP:SMARTORE_GROUP}
        prefer-ip-address: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000   # 显式超时：readTimeout 必须 << STALE_SECONDS(60)，否则探测判失败与迟到提交撞车
            read-timeout: 10000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SMARTORE_MYSQL_HOST:127.0.0.1}:${SMARTORE_MYSQL_PORT:33306}/smartore_goods?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SMARTORE_MYSQL_USER:root}
    password: ${SMARTORE_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:com/smartore/**/mapper/*.xml

pagehelper:
  helper-dialect: mysql

springdoc:
  # 服务端只暴露 OpenAPI spec，UI 统一在网关聚合（见 smartore-gateway 的 springdoc.swagger-ui.urls）。
  # 路径前缀带服务名，网关按前缀路由，无需 StripPrefix。
  api-docs:
    path: /doc/goods/v3/api-docs

management:
  metrics:
    distribution:
      percentiles-histogram:
        # 不开 histogram，Micrometer 不发 *_seconds_bucket 序列，P95 告警/看板永远无数据
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

smartore:
  internal-token: ${SMARTORE_INTERNAL_TOKEN:}
  gateway-token: ${SMARTORE_GATEWAY_TOKEN:}
  cache:
    enabled: ${SMARTORE_GOODS_CACHE_ENABLED:true}
    # Key 前缀按服务隔离：与其他服务共用 db0 时靠前缀区分
    key-prefix: "goods:cache:"
    default-ttl: 30m
    # 分区 TTL（键名必须与 GoodsCacheNames 一致，写错只会静默用 default-ttl）
    ttls:
      # 商品列表/单品：库存展示值允许 TTL 内陈旧（下单的权威校验是 stock 表的条件扣减，
      # 且库存真变动时 StockSagaService 会精确失效 id=N 单键，预检路径始终新鲜）
      product: 60s
      # 详情/参数/字典：变更少、读多，用长 TTL + 写时失效
      detail: 30m
      param: 30m
      category: 30m
      brand: 30m

logging:
  level:
    root: info
  file:
    name: logs/smartore-goods.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
