server:
  port: ${SMARTORE_TRADE_PORT:9103}
  shutdown: graceful

spring:
  application:
    name: smartore-trade
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        server-addr: ${SMARTORE_NACOS_ADDR:127.0.0.1:28848}
        username: ${SMARTORE_NACOS_USERNAME:nacos}
        password: ${SMARTORE_NACOS_PASSWORD:nacos}
        group: ${SMARTORE_NACOS_GROUP:SMARTORE_GROUP}
        prefer-ip-address: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000   # 显式超时：readTimeout 必须 << STALE_SECONDS(60)，否则探测判失败与迟到提交撞车
            read-timeout: 10000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SMARTORE_MYSQL_HOST:127.0.0.1}:${SMARTORE_MYSQL_PORT:33306}/smartore_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SMARTORE_MYSQL_USER:root}
    password: ${SMARTORE_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SMARTORE_RABBIT_HOST:127.0.0.1}
    port: ${SMARTORE_RABBIT_PORT:5774}
    username: ${SMARTORE_RABBIT_USER:smartore}
    password: ${SMARTORE_RABBIT_PASSWORD:}
    virtual-host: ${SMARTORE_RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:com/smartore/**/mapper/*.xml

pagehelper:
  helper-dialect: mysql

springdoc:
  # 服务端只暴露 OpenAPI spec，UI 统一在网关聚合（见 smartore-gateway 的 springdoc.swagger-ui.urls）。
  # 路径前缀带服务名，网关按前缀路由，无需 StripPrefix。
  api-docs:
    path: /doc/trade/v3/api-docs

management:
  metrics:
    distribution:
      percentiles-histogram:
        # 不开 histogram，Micrometer 不发 *_seconds_bucket 序列，P95 告警/看板永远无数据
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

smartore:
  internal-token: ${SMARTORE_INTERNAL_TOKEN:}
  gateway-token: ${SMARTORE_GATEWAY_TOKEN:}

logging:
  level:
    root: info
  file:
    name: logs/smartore-trade.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
