server:
  port: ${MINDCART_VOICE_PORT:9105}
  shutdown: graceful
  servlet:
    # Tomcat per-message WebSocket 缓冲区：默认 8192 会让大 JSON 下行触发 1009 断连
    context-parameters:
      org.apache.tomcat.websocket.textBufferSize: 524288
      org.apache.tomcat.websocket.binaryBufferSize: 524288

spring:
  application:
    name: mindcart-voice
  # Java 21 虚拟线程承载 Web 请求与 @Async：本服务几乎全是 IO 密集调用（LLM/语音/DB/Redis）
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 15s
  cloud:
    nacos:
      discovery:
        server-addr: ${MINDCART_NACOS_ADDR:127.0.0.1:28848}
        username: ${MINDCART_NACOS_USERNAME:}
        password: ${MINDCART_NACOS_PASSWORD:}
        group: ${MINDCART_NACOS_GROUP:MINDCART_GROUP}
        # 注册地址自动探测（不要硬编码 127.0.0.1：容器化后网关会连到自己的 loopback）。
        # 服务绑定 0.0.0.0，无论 jar 方式还是容器方式注册出的 IP 都可被网关直连。
        prefer-ip-address: true
  openfeign:
    client:
      config:
        default:
          connect-timeout: 2000
          read-timeout: 10000
  datasource:
    url: jdbc:postgresql://${MINDCART_POSTGRES_HOST:127.0.0.1}:${MINDCART_POSTGRES_PORT:35432}/${MINDCART_POSTGRES_DB:mindcart_voice}
    username: ${MINDCART_POSTGRES_USER:mindcart}
    password: ${MINDCART_POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # pgvector 0.8+：带标量过滤的 HNSW 查询必须开迭代扫描，否则过滤后取不满 LIMIT 且非真近邻
      connection-init-sql: "SET hnsw.iterative_scan = relaxed_order; SET hnsw.ef_search = 100"
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 1700000
      keepalive-time: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${MINDCART_REDIS_HOST:127.0.0.1}
      port: ${MINDCART_REDIS_PORT:26379}
      password: ${MINDCART_REDIS_PASSWORD:}
      # 与既有服务隔离：MindCart 业务默认 db0，语音服务固定 db3，key 另有 vs: 前缀
      database: ${MINDCART_VOICE_REDIS_DB:3}
  cache:
    type: redis

# 网关/集群双凭证（scripts/dev.sh bootstrap 生成；空值时 common 的 UserContextFilter 启动 fail-fast）
mindcart:
  internal-token: ${MINDCART_INTERNAL_TOKEN:}
  gateway-token: ${MINDCART_GATEWAY_TOKEN:}

# AgentScope + DashScope（ASR/TTS/Embedding 走 DashScope 原生 SDK，复用底座的百炼 key）
agentscope:
  dashscope:
    api-key: ${MINDCART_EMBED_API_KEY:${DASHSCOPE_API_KEY:sk-}}
    model-name: ${MINDCART_CHAT_MODEL:qwen-plus}

# 语音导购自定义配置（前缀沿用原项目，配置体自包含）
# 注意：llm.base-url / api-key / 三档模型名 与 embedding 的 key/model 只是兜底值——
# 首次使用时优先采用 mindcart-ai 后台【AI模型配置】里启用的 CHAT/EMBEDDING 配置
#（LlmConfigResolver → /internal/model-config/active），ai 不可达或远端为非
# DashScope 的 EMBEDDING 端点时才回落到这里的本地值
voice-shopping:
  llm:
    # LLM 走 OpenAI 兼容端点，默认复用底座的 chat 配置
    base-url: ${MINDCART_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${MINDCART_CHAT_API_KEY:${DASHSCOPE_API_KEY:sk-}}
    enable-thinking: ${LLM_ENABLE_THINKING:false}
    main-model: ${MINDCART_CHAT_MODEL:qwen-plus}    # 话术
    mid-model: ${MINDCART_CHAT_MODEL:qwen-plus}     # 点评团（非关键路径）
    light-model: ${MINDCART_CHAT_MODEL:qwen-plus}   # 意图
    call-timeout: ${LLM_CALL_TIMEOUT:20s}
    stream-timeout: ${LLM_STREAM_TIMEOUT:60s}
    pricing:
      input-per-1k: ${LLM_PRICE_INPUT:0.04}
      output-per-1k: ${LLM_PRICE_OUTPUT:0.12}
  tts:
    normalize-numbers: ${TTS_NORMALIZE_NUMBERS:true}
  asr:
    vad-silence-ms: ${ASR_VAD_SILENCE_MS:400}
    flush-grace-ms: ${ASR_FLUSH_GRACE_MS:400}
    settle-ms: ${ASR_SETTLE_MS:700}
  orch:
    sentence-merge-delay-ms: ${ORCH_SENTENCE_MERGE_DELAY_MS:500}
  normalize:
    # 品类同义词（已按 MindCart 真实类目校准）：键=LLM 常见抽取原词，值=category_l2（MindCart 单层类目名）
    category-synonyms: ${VOICE_CATEGORY_SYNONYMS:手机:手机通讯,苹果手机:手机通讯,电话:手机通讯,电脑:笔记本电脑,笔记本:笔记本电脑,轻薄本:笔记本电脑,游戏本:笔记本电脑,耳机:耳机音箱,蓝牙耳机:耳机音箱,降噪耳机:耳机音箱,头戴耳机:耳机音箱,音箱:耳机音箱,音响:耳机音箱,手表:智能穿戴,智能手表:智能穿戴,手环:智能穿戴,扫地机器人:清洁电器,吸尘器:清洁电器,电饭煲:厨房电器,空气炸锅:厨房电器,咖啡机:厨房电器,护肤品:护肤套装,面膜:护肤套装,精华:护肤套装,洗发水:个护清洁,沐浴露:个护清洁,跑鞋:运动鞋服,跑步鞋:运动鞋服,运动鞋:运动鞋服,球鞋:运动鞋服,运动服:运动鞋服,哑铃:健身装备,瑜伽垫:健身装备,健身器材:健身装备,编程书:编程开发,技术书:编程开发,真题:考试考证,考证:考试考证,管理书:职场成长}
  recommend:
    semantic-rerank:
      enabled: ${SEMANTIC_RERANK_ENABLED:true}
      model: qwen3.7-text-rerank
  embedding:
    # 向量模型维度必须与 schema 的 VECTOR(1024) 对齐；换模型后调 /voice/admin/reindex 全量重建
    model: ${MINDCART_EMBED_MODEL:text-embedding-v4}
    dim: 1024
  vector:
    product-topk: 20
  voice:
    # ASR 与 TTS 均走 omni 实时会话（网关型 key 只放行 compatible-mode，不提供 paraformer/cosyvoice 原生协议）
    asr-model: ${ASR_MODEL:qwen3.5-omni-flash-realtime}
    tts-model: ${TTS_MODEL:qwen3.5-omni-flash-realtime}
    tts-voice: Tina
  session:
    ttl-minutes: 30
    max-history-turns: 10
  compliance:
    absolute-claim-patterns: "最好,第一,保证,绝对"
  perspective:
    enabled: true
  resilience:
    rules-file: ${SENTINEL_RULES_FILE:}
    max-concurrency: 32
    qps-limit: 20
    slow-call-ms: 20000
    circuit-break-ratio: 0.5
    circuit-break-seconds: 20
  # 调试端点闸门：false 时 /voice/debug/** 全部 404（网关上该前缀另有 ADMIN 规则双保险）
  debug:
    enabled: ${MINDCART_VOICE_DEBUG:false}

springdoc:
  # 服务端只暴露 OpenAPI spec，UI 统一在网关聚合（见 mindcart-gateway 的 springdoc.swagger-ui.urls）。
  # 路径前缀带服务名，网关按前缀路由，无需 StripPrefix。
  api-docs:
    path: /doc/voice/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.mindcart.voice: DEBUG
    # WS 断连原因（1009 buffer too small 等）默认被隐藏，排查期必须开
    org.springframework.web.socket: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}%X{traceId:-}] %logger{36} - %msg%n"
