server:
  port: ${SMARTORE_GATEWAY_PORT:9080}
  shutdown: graceful

spring:
  application:
    name: smartore-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Redis 令牌桶限流（RequestRateLimiter 的 key-resolver 与 store）。
  # 必须显式配置：此前缺失时 Boot 回落到 localhost:6379，宿主机恰好有本地 Redis 才没暴露——
  # 容器化/纯 mall 栈环境下会连不上，且限流状态与业务缓存不在同一实例。
  data:
    redis:
      host: ${SMARTORE_REDIS_HOST:127.0.0.1}
      port: ${SMARTORE_REDIS_PORT:26379}
      password: ${SMARTORE_REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${SMARTORE_NACOS_ADDR:127.0.0.1:28848}
        username: ${SMARTORE_NACOS_USERNAME:nacos}
        password: ${SMARTORE_NACOS_PASSWORD:nacos}
        group: ${SMARTORE_NACOS_GROUP:SMARTORE_GROUP}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false # 路由全部显式声明，不按服务名自动暴露
          routes:
            - id: user
              uri: lb://smartore-user
              predicates: [ "Path=/user/**,/userAddress/**,/wallet/**,/files/**" ]
            - id: goods
              uri: lb://smartore-goods
              predicates: [ "Path=/product/**,/productBrand/**,/productCategory/**,/productParam/**,/productDetail/**,/productFavorite/**,/productReview/**,/afterSaleRule/**,/operLog/**" ]
            - id: trade
              uri: lb://smartore-trade
              predicates: [ "Path=/shoppingCart/**,/shopOrder/**" ]
            - id: ai
              uri: lb://smartore-ai
              predicates: [ "Path=/aiModelConfig/**,/promptTemplate/**,/functionTool/**,/productTool/**,/businessTool/**,/productKnowledge/**,/productKnowledgeChunk/**,/productKnowledgeEmbedding/**,/agentRun/**,/agentStep/**,/shoppingGuideTask/**,/shoppingRecommendation/**,/shoppingQa/**,/shoppingReviewAnalysis/**,/shoppingGrowthReport/**,/aiOperLog/**" ]
            # 语音导购（新增互补服务，未启动时仅 /voice/** 503，不影响其他路由）
            # WS 升级与-plain HTTP 分开两条：lb:ws:// 只承接 WebSocket 握手
            - id: voice-ws
              uri: lb:ws://smartore-voice
              predicates: [ "Path=/voice/ws" ]
            - id: voice
              uri: lb://smartore-voice
              predicates: [ "Path=/voice/**" ]
            # 接口文档：各服务的 spec 暴露在 /doc/<svc>/v3/api-docs，网关按前缀转发。
            # 路径本身带服务名，因此不需要 StripPrefix 重写。
            - id: doc-user
              uri: lb://smartore-user
              predicates: [ "Path=/doc/user/**" ]
            - id: doc-goods
              uri: lb://smartore-goods
              predicates: [ "Path=/doc/goods/**" ]
            - id: doc-trade
              uri: lb://smartore-trade
              predicates: [ "Path=/doc/trade/**" ]
            - id: doc-ai
              uri: lb://smartore-ai
              predicates: [ "Path=/doc/ai/**" ]
            - id: doc-voice
              uri: lb://smartore-voice
              predicates: [ "Path=/doc/voice/**" ]
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${SMARTORE_RATE_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${SMARTORE_RATE_BURST:60}
                key-resolver: "#{@userKeyResolver}"

# 网关聚合接口文档：一个 /doc.html 汇总五个服务的 spec（下拉切换）。
# 各服务只暴露 spec，UI 只在这里渲染。
springdoc:
  swagger-ui:
    path: /doc.html
    disable-swagger-default-url: true
    urls:
      - name: 用户服务 smartore-user
        url: /doc/user/v3/api-docs
      - name: 商品服务 smartore-goods
        url: /doc/goods/v3/api-docs
      - name: 交易服务 smartore-trade
        url: /doc/trade/v3/api-docs
      - name: AI 服务 smartore-ai
        url: /doc/ai/v3/api-docs
      - name: 语音服务 smartore-voice
        url: /doc/voice/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

smartore:
  gateway-token: ${SMARTORE_GATEWAY_TOKEN:}
  auth:
    jwt-secret: ${SMARTORE_JWT_SECRET:}
    public-paths:
      - "POST /user/login"
      - "POST /user/register"
      - "GET /files/download/**"
      # 接口文档：只读的 OpenAPI spec 与静态 UI。
      # 免登录是为了能在浏览器直接打开；限流仍在（走 default-filters），
      # 若部署到公网且不想暴露接口清单，把这 4 条删掉即可，其余功能不受影响。
      - "GET /doc.html"
      - "GET /doc/**"
      - "GET /webjars/**"
      - "GET /v3/api-docs/**"
    # 管理规则：命中即要求 ADMIN（读写分离 —— 前台只读商品字典，写操作归管理端）
    admin-rules:
      - "POST /user/add"
      - "DELETE /user/delete/**"
      - "GET /user/selectAll"
      - "GET /user/selectPage"
      - "POST /product/add"
      - "PUT /product/update"
      - "DELETE /product/delete/**"
      - "POST /productBrand/add"
      - "PUT /productBrand/update"
      - "DELETE /productBrand/delete/**"
      - "POST /productCategory/add"
      - "PUT /productCategory/update"
      - "DELETE /productCategory/delete/**"
      - "POST /productParam/add"
      - "PUT /productParam/update"
      - "DELETE /productParam/delete/**"
      - "POST /productDetail/save"
      - "PUT /productReview/audit"
      - "/afterSaleRule/**"
      # 操作审计查询：谁改了什么，只给管理员看（审计表分库，goods 与 ai 各一个入口）
      - "GET /operLog/**"
      - "GET /aiOperLog/**"
      - "/aiModelConfig/**"
      - "/promptTemplate/**"
      - "/functionTool/**"
      - "/productTool/**"
      - "/businessTool/**"
      - "/productKnowledge/**"
      - "/productKnowledgeChunk/**"
      - "/productKnowledgeEmbedding/**"
      - "/shoppingReviewAnalysis/**"
      - "/shoppingGrowthReport/**"
      - "/agentRun/**"
      - "/agentStep/**"
      - "PUT /shopOrder/ship/**"
      - "GET /shopOrder/selectPage"
      # Outbox 运维：账本水位可看，复位重投会真的重发消息
      - "GET /shopOrder/outboxStats"
      - "POST /shopOrder/replayOutbox"
      - "GET /shoppingQa/selectPage"
      - "DELETE /shoppingQa/delete/**"
      - "DELETE /shoppingGuideTask/delete/**"
      - "DELETE /shoppingRecommendation/delete/**"
      - "/voice/debug/**"
      - "/voice/admin/**"

logging:
  level:
    root: info
  file:
    name: logs/smartore-gateway.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
