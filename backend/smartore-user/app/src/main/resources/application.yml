server:
  port: ${SMARTORE_USER_PORT:9101}
  shutdown: graceful

spring:
  application:
    name: smartore-user
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cloud:
    nacos:
      discovery:
        server-addr: ${SMARTORE_NACOS_ADDR:127.0.0.1:28848}
        username: ${SMARTORE_NACOS_USERNAME:nacos}
        password: ${SMARTORE_NACOS_PASSWORD:nacos}
        group: ${SMARTORE_NACOS_GROUP:SMARTORE_GROUP}
        prefer-ip-address: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SMARTORE_MYSQL_HOST:127.0.0.1}:${SMARTORE_MYSQL_PORT:33306}/smartore_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SMARTORE_MYSQL_USER:root}
    password: ${SMARTORE_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:com/smartore/**/mapper/*.xml

pagehelper:
  helper-dialect: mysql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

smartore:
  internal-token: ${SMARTORE_INTERNAL_TOKEN:}
  jwt:
    secret: ${SMARTORE_JWT_SECRET:}
    ttl-hours: ${SMARTORE_JWT_TTL_HOURS:72}
  file:
    dir: ${SMARTORE_FILE_DIR:./files}
    base-url: ${SMARTORE_FILE_BASE_URL:http://localhost:9080}

logging:
  level:
    root: info
  file:
    name: logs/smartore-user.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
