server:
  port: ${SMARTORE_AI_PORT:9104}
  shutdown: graceful

spring:
  application:
    name: smartore-ai
  autoconfigure:
    # 模型客户端全部由 SpringAiModelFactory 按数据库配置动态构建，
    # 关掉 Spring AI 的静态自动配置（无静态 api-key 时会启动失败）
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        server-addr: ${SMARTORE_NACOS_ADDR:127.0.0.1:28848}
        username: ${SMARTORE_NACOS_USERNAME:nacos}
        password: ${SMARTORE_NACOS_PASSWORD:nacos}
        group: ${SMARTORE_NACOS_GROUP:SMARTORE_GROUP}
        prefer-ip-address: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000   # 显式超时：readTimeout 必须 << STALE_SECONDS(60)，否则探测判失败与迟到提交撞车
            read-timeout: 10000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SMARTORE_MYSQL_HOST:127.0.0.1}:${SMARTORE_MYSQL_PORT:33306}/smartore_ai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SMARTORE_MYSQL_USER:root}
    password: ${SMARTORE_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SMARTORE_RABBIT_HOST:127.0.0.1}
    port: ${SMARTORE_RABBIT_PORT:5774}
    username: ${SMARTORE_RABBIT_USER:smartore}
    password: ${SMARTORE_RABBIT_PASSWORD:}
    virtual-host: ${SMARTORE_RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  data:
    redis:
      host: ${SMARTORE_REDIS_HOST:127.0.0.1}
      port: ${SMARTORE_REDIS_PORT:26379}
      password: ${SMARTORE_REDIS_PASSWORD:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:com/smartore/**/mapper/*.xml

pagehelper:
  helper-dialect: mysql

springdoc:
  # 服务端只暴露 OpenAPI spec，UI 统一在网关聚合（见 smartore-gateway 的 springdoc.swagger-ui.urls）。
  # 路径前缀带服务名，网关按前缀路由，无需 StripPrefix。
  api-docs:
    path: /doc/ai/v3/api-docs

management:
  metrics:
    distribution:
      percentiles-histogram:
        # 不开 histogram，Micrometer 不发 *_seconds_bucket 序列，P95 告警/看板永远无数据
        http.server.requests: true
        smartore.llm.call: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

smartore:
  internal-token: ${SMARTORE_INTERNAL_TOKEN:}
  gateway-token: ${SMARTORE_GATEWAY_TOKEN:}
  model:
    crypto-key: ${SMARTORE_MODEL_CRYPTO_KEY:}
    chat:
      api-key: ${SMARTORE_CHAT_API_KEY:}
      base-url: ${SMARTORE_CHAT_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${SMARTORE_CHAT_MODEL:deepseek-chat}
    embedding:
      api-key: ${SMARTORE_EMBED_API_KEY:}
      base-url: ${SMARTORE_EMBED_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${SMARTORE_EMBED_MODEL:text-embedding-v4}

logging:
  level:
    root: info
  file:
    name: logs/smartore-ai.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
