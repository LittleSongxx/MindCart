server:
  port: ${SMARTORE_AI_PORT:9104}
  shutdown: graceful

spring:
  application:
    name: smartore-ai
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        server-addr: ${SMARTORE_NACOS_ADDR:127.0.0.1:28848}
        username: ${SMARTORE_NACOS_USERNAME:nacos}
        password: ${SMARTORE_NACOS_PASSWORD:nacos}
        group: ${SMARTORE_NACOS_GROUP:SMARTORE_GROUP}
        prefer-ip-address: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SMARTORE_MYSQL_HOST:127.0.0.1}:${SMARTORE_MYSQL_PORT:33306}/smartore_ai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SMARTORE_MYSQL_USER:root}
    password: ${SMARTORE_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SMARTORE_RABBIT_HOST:127.0.0.1}
    port: ${SMARTORE_RABBIT_PORT:5674}
    username: ${SMARTORE_RABBIT_USER:smartore}
    password: ${SMARTORE_RABBIT_PASSWORD:}
    virtual-host: ${SMARTORE_RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
  data:
    redis:
      host: ${SMARTORE_REDIS_HOST:127.0.0.1}
      port: ${SMARTORE_REDIS_PORT:26379}
      password: ${SMARTORE_REDIS_PASSWORD:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:com/smartore/**/mapper/*.xml

pagehelper:
  helper-dialect: mysql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

smartore:
  internal-token: ${SMARTORE_INTERNAL_TOKEN:}
  model:
    crypto-key: ${SMARTORE_MODEL_CRYPTO_KEY:}
    chat:
      api-key: ${SMARTORE_CHAT_API_KEY:}
      base-url: ${SMARTORE_CHAT_BASE_URL:https://api.deepseek.com/v1}
      model-name: ${SMARTORE_CHAT_MODEL:deepseek-chat}
    embedding:
      api-key: ${SMARTORE_EMBED_API_KEY:}
      base-url: ${SMARTORE_EMBED_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${SMARTORE_EMBED_MODEL:text-embedding-v4}

logging:
  level:
    root: info
  file:
    name: logs/smartore-ai.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
