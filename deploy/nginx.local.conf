# Smartore Web 容器（Docker 部署用）：静态 SPA + /api 反代到 gateway 容器。
# 与 ops/nginx/smartore.conf（生产，反代宿主 127.0.0.1:9080）的区别仅在上游地址。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由：深链交给前端 router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway:9080/;      # 尾斜杠：剥掉 /api 前缀（网关按裸路径路由）
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 语音导购 WebSocket（/api/voice/ws → /voice/ws）与 SSE 都需要升级头与关缓冲
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1800s;             # 语音长连接（服务端会话 TTL 30min）
    }
}
