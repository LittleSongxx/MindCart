# Smartore 应用栈（Docker 部署）：六个服务容器化，**复用 mall 中间件容器**——不新建任何
# MySQL/Redis/RabbitMQ/Nacos/PG，全部通过外部网络 mall_default 以容器名互访。
#
# 前置：run/runtime.env 已 bootstrap；中间件已起且健康
#   ./scripts/dev.sh bootstrap && ./scripts/dev.sh infra-up
# 部署（首次或改代码后需重新 package）：
#   cd backend && mvn -q package -DskipTests && cd ..
#   docker compose -f deploy/compose.apps.yaml up -d --build
# 查看 / 停止：
#   docker compose -f deploy/compose.apps.yaml ps
#   docker compose -f deploy/compose.apps.yaml down
# 浏览器入口：http://localhost:${SMARTORE_WEB_PORT:-8081}（web 容器，/api 反代到 gateway 容器）
#
# 与 jar 方式（scripts/dev.sh up）二选一，不能同时跑（端口冲突）。
# 切回 jar 方式：docker compose -f deploy/compose.apps.yaml down && ./scripts/dev.sh up
name: smartore-apps

networks:
  # 复用 mall 中间件所在网络；中间件容器名即主机名
  # （mall-mysql / mall-redis / mall-rabbitmq / mall-nacos / mall-postgres）
  mall:
    external: true
    name: mall_default

x-app: &app
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file:
    - ../run/runtime.env          # 密钥唯一来源（gitignored，600）：JWT/内部令牌/模型 Key/PG 口令
  networks: [ mall ]
  restart: unless-stopped
  # 中间件指向 mall 容器（覆盖 runtime.env 里宿主机 127.0.0.1:端口 的映射）
  environment: &app-env
    TZ: Asia/Shanghai
    JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    SMARTORE_MYSQL_HOST: mall-mysql
    SMARTORE_MYSQL_PORT: "3306"
    SMARTORE_REDIS_HOST: mall-redis
    SMARTORE_REDIS_PORT: "6379"
    SMARTORE_RABBIT_HOST: mall-rabbitmq
    SMARTORE_RABBIT_PORT: "5672"
    SMARTORE_NACOS_ADDR: mall-nacos:8848

services:
  user:
    <<: *app
    container_name: smartore-user
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { JAR_FILE: smartore-user/app/target/smartore-user-app-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      # 上传文件落容器卷（runtime.env 里的 SMARTORE_FILE_DIR 是宿主路径，容器内不可用）
      SMARTORE_FILE_DIR: /data/files
      SMARTORE_FILE_BASE_URL: http://localhost:${SMARTORE_WEB_PORT:-8081}
    volumes:
      # 绑宿主 run/files（与 jar 方式共用同一份上传存储）：历史头像/图片在容器里同样可读
      - ../run/files:/data/files
    ports:
      - "127.0.0.1:9101:9101"
    deploy:
      resources: { limits: { memory: 512M } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9101/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  goods:
    <<: *app
    container_name: smartore-goods
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { JAR_FILE: smartore-goods/app/target/smartore-goods-app-0.1.0-SNAPSHOT.jar }
    ports:
      - "127.0.0.1:9102:9102"
    deploy:
      resources: { limits: { memory: 512M } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9102/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  trade:
    <<: *app
    container_name: smartore-trade
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { JAR_FILE: smartore-trade/app/target/smartore-trade-app-0.1.0-SNAPSHOT.jar }
    ports:
      - "127.0.0.1:9103:9103"
    deploy:
      resources: { limits: { memory: 512M } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9103/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  ai:
    <<: *app
    container_name: smartore-ai
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { JAR_FILE: smartore-ai/target/smartore-ai-0.1.0-SNAPSHOT.jar }
    ports:
      - "127.0.0.1:9104:9104"
    deploy:
      resources: { limits: { memory: 640M } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9104/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  voice:
    <<: *app
    container_name: smartore-voice
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { JAR_FILE: smartore-voice/target/smartore-voice-0.1.0-SNAPSHOT.jar }
    environment:
      <<: *app-env
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      # 语音服务自带的 PG（mall-postgres 容器，库 smartore_voice，Flyway 自管）
      SMARTORE_POSTGRES_HOST: mall-postgres
      SMARTORE_POSTGRES_PORT: "5432"
      # 本地演示态：开放 /voice/debug/**（网关 ADMIN 规则 + X-Gateway/X-Internal-Token 双重保护）。
      # 生产部署置 false，调试/管理端点直接 404。
      SMARTORE_VOICE_DEBUG: "true"
    ports:
      - "127.0.0.1:9105:9105"
    # voice 依赖 ai 的知识检索与模型配置下发（LlmConfigResolver 启动拉取），后于 ai 起
    depends_on:
      ai: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 768M } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9105/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    <<: *app
    container_name: smartore-gateway
    build:
      context: ../backend
      dockerfile: Dockerfile
      args: { JAR_FILE: smartore-gateway/target/smartore-gateway-0.1.0-SNAPSHOT.jar }
    # 网关最后起：等业务服务注册进 Nacos，避免首个请求 503
    depends_on:
      user:  { condition: service_healthy }
      goods: { condition: service_healthy }
      trade: { condition: service_healthy }
      ai:    { condition: service_healthy }
      voice: { condition: service_healthy }
    ports:
      - "127.0.0.1:9080:9080"
    deploy:
      resources: { limits: { memory: 512M } }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # 前端静态站 + /api 反代（浏览器唯一入口；SPA 构建产物由宿主机 npm run build 生成）
  web:
    image: nginx:1.27-alpine
    container_name: smartore-web
    restart: unless-stopped
    networks: [ mall ]
    depends_on:
      gateway: { condition: service_healthy }
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SMARTORE_WEB_PORT:-8081}:80"
    healthcheck:
      # 必须写 127.0.0.1：busybox wget 会把 localhost 解析到 ::1，而 nginx 默认只监听 IPv4 → 误报 unhealthy
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
