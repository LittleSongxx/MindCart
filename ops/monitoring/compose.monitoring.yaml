# Smartore 监控栈（与 deploy/compose.yaml 同网络边界，host.docker.internal 抓宿主机服务指标）
name: mall

services:
  mall-prometheus:
    image: prom/prometheus:v3.13.2
    container_name: mall-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - mall-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mall-grafana:
    image: grafana/grafana:13.1.3
    container_name: mall-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${SMARTORE_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SMARTORE_GRAFANA_PASSWORD:-smartore}
    ports:
      - "127.0.0.1:3999:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - mall-grafana-data:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mall-prometheus

volumes:
  mall-prometheus-data:
  mall-grafana-data:
