# MindCart 监控采集：6 个 Java 服务（host 网络直连本机端口，含 voice/9105）+ 中间件 exporter 按需扩展
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['mall-alertmanager:9093']  # compose.monitoring.yaml 同栈部署

scrape_configs:
  - job_name: mindcart-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:9080'] }]
  - job_name: mindcart-user
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:9101'] }]
  - job_name: mindcart-goods
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:9102'] }]
  - job_name: mindcart-trade
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:9103'] }]
  - job_name: mindcart-ai
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:9104'] }]
  - job_name: mindcart-voice
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:9105'] }]
