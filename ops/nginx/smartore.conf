# Smartore 前端 + API 反代（80 端口，HTTPS 待域名/备案后追加）
server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    # 前端（单 SPA，前台与管理端同应用）
    root /opt/smartore/current/web/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代网关
    location /api/ {
        proxy_pass http://127.0.0.1:9080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式问答：默认响应缓冲会把 delta 攒到缓冲满才吐，"流式"失效
        proxy_buffering off;
        # 语音导购 WebSocket（/voice/ws）：升级头 + 长连接读超时（对齐服务会话 TTL 30min）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 180s > 后端 SseEmitter 超时 120s，留出完成事件的时间余量；WS 空闲保活由更长的读超时覆盖
        proxy_read_timeout 1800s;
    }
}
